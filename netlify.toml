# ============================================================
# hiConstitution — Netlify Configuration
# ============================================================

[build]
  publish = "."

# ------------------------------------------------------------
# Force HTTPS
# ------------------------------------------------------------
[[redirects]]
  from   = "http://hiconstitution.com/*"
  to     = "https://hiconstitution.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.hiconstitution.com/*"
  to     = "https://hiconstitution.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.hiconstitution.com/*"
  to     = "https://hiconstitution.com/:splat"
  status = 301
  force  = true

# ------------------------------------------------------------
# Security Headers — applied to all routes
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"

# ------------------------------------------------------------
# Cache Headers — HTML (1 hour)
# ------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ------------------------------------------------------------
# Cache Headers — CSS & JS (1 year, immutable)
# ------------------------------------------------------------
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------------------------
# Cache Headers — Fonts & Images (1 year)
# ------------------------------------------------------------
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ------------------------------------------------------------
# Cache Headers — JSON data (1 day)
# ------------------------------------------------------------
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
