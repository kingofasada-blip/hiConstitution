<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: deep navy -->
  <rect width="1200" height="630" fill="#1A237E"/>

  <!-- Subtle decorative accent bars -->
  <rect x="0" y="0" width="8" height="630" fill="#F37324"/>
  <rect x="1192" y="0" width="8" height="630" fill="#F37324"/>
  <rect x="0" y="0" width="1200" height="8" fill="#F37324"/>
  <rect x="0" y="622" width="1200" height="8" fill="#F37324"/>

  <!-- Ashoka Chakra outline (decorative circle) -->
  <circle cx="600" cy="280" r="155" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.12"/>
  <circle cx="600" cy="280" r="130" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.10"/>

  <!-- Main title: hiConstitution -->
  <text
    x="600"
    y="320"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="84"
    font-weight="bold"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-1">hiConstitution</text>

  <!-- Saffron divider line -->
  <rect x="340" y="348" width="520" height="4" rx="2" fill="#F37324"/>

  <!-- Subtitle -->
  <text
    x="600"
    y="400"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    fill="#F37324"
    text-anchor="middle"
    letter-spacing="1">Learn the Indian Constitution</text>

  <!-- Domain -->
  <text
    x="600"
    y="460"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#FFFFFF"
    text-anchor="middle"
    opacity="0.65">hiconstitution.com</text>
</svg>
