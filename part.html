  <style>
    .part-page { padding-top: var(--navbar-h); min-height: 100vh; background: var(--bg-light); padding-bottom: 80px; }
    .part-header {
      background: linear-gradient(135deg, #28348e 0%, #3141ad 55%, #3d4fbe 100%);
      padding: 56px 0 64px; color: var(--white); text-align: center;
    }
    .part-header h1 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 12px; color: var(--white); }
    .part-header p { color: rgba(255,255,255,0.75); max-width: 600px; margin: 0 auto; font-size: 1.05rem; }
    .back-link { color: var(--saffron); font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }

    .article-list-container { max-width: 860px; margin: 40px auto 0; padding: 0 20px; }
    .part-special-card {
      max-width: 980px;
      margin: -24px auto 0;
      padding: 0 20px;
      display: none;
    }
    .part-special-card.visible { display: block; }
    .part-special-shell {
      background: linear-gradient(180deg, #fffef9 0%, #fff8ed 100%);
      border: 1px solid rgba(164, 126, 63, 0.18);
      border-radius: 24px;
      box-shadow: 0 14px 34px rgba(34, 41, 87, 0.08);
      overflow: hidden;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      align-items: stretch;
    }
    .part-special-art {
      background: linear-gradient(180deg, #efe1c5 0%, #e5d0aa 100%);
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .part-special-art img {
      width: 100%;
      max-width: 260px;
      display: block;
      border-radius: 18px;
      box-shadow: 0 10px 22px rgba(92, 68, 30, 0.16);
      border: 1px solid rgba(120, 91, 39, 0.18);
    }
    .part-special-copy {
      padding: 28px 30px;
      text-align: left;
    }
    .part-special-label {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8C5A1C;
      background: rgba(243, 115, 36, 0.12);
      border-radius: 999px;
      padding: 6px 10px;
      margin-bottom: 14px;
    }
    .part-special-copy h2 {
      font-size: clamp(1.35rem, 2.8vw, 2rem);
      color: var(--navy);
      margin-bottom: 12px;
    }
    .part-special-copy p {
      margin: 0;
      color: var(--body-text);
      line-height: 1.8;
      font-size: 0.98rem;
      max-width: 60ch;
    }
    
    /* Colorful List View */
    .article-list-item {
      display: flex;
      align-items: center;
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      margin-bottom: 16px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      border-left: 5px solid var(--saffron);
      transition: all 0.2s ease;
      border-top: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }
    .article-list-item:hover {
      transform: translateX(6px);
      border-left-color: var(--navy);
      box-shadow: var(--shadow-sm);
      background: var(--bg-subtle);
    }
    .article-list-item:nth-child(even) { border-left-color: var(--green); }
    .article-list-item:nth-child(even):hover { border-left-color: var(--navy); }
    
    .art-content { flex: 1; min-width: 0; word-wrap: break-word; overflow-wrap: break-word; }
    .art-content h3 { font-size: 1.15rem; color: var(--navy); margin-bottom: 6px; }
    .art-content p { font-size: 0.9rem; color: var(--body-text); margin: 0; line-height: 1.5; }
    .art-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .art-status {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 99px;
      line-height: 1;
    }
    .art-status.ready { background: #E8F5E9; color: var(--green); }
    .art-status.pending { background: #FFF3E8; color: var(--saffron); }
    .art-arrow { font-size: 1.5rem; color: var(--muted); margin-left: 20px; transition: color 0.2s; }
    .article-list-item:hover .art-arrow { color: var(--saffron); }

    @media (max-width: 760px) {
      .part-special-card { margin-top: -18px; }
      .part-special-shell { grid-template-columns: 1fr; }
      .part-special-art { padding: 20px 20px 0; }
      .part-special-art img { max-width: 280px; }
      .part-special-copy { padding: 22px 20px 24px; }
    }
    @media (max-width: 600px) {
      .article-list-container { padding: 0 16px; }
      .article-list-item { padding: 16px; margin-bottom: 12px; }
      .art-content h3 { font-size: 1.05rem; }
      .art-content p { font-size: 0.85rem; }
      .art-meta { gap: 6px; }
      .art-status { font-size: 0.65rem; padding: 3px 6px; }
      .art-arrow { margin-left: 12px; font-size: 1.2rem; }
    }
  </style>

<script>
  function createSlug(text) {
    return text.toString().toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/\-\-+/g, '-')
      .replace(/^-+/, '')
      .replace(/-+$/, '');
  }

  function status(label, ready) {
    return `<span class="art-status ${ready ? 'ready' : 'pending'}">${label}</span>`;
  }

  function renderPartArtwork(partId) {
    const card = document.getElementById('partSpecialCard');
    
    let artworkHtml = '';

    if (partId === 'I') {
      artworkHtml = `
      <section class="part-special-shell" aria-label="Part I artwork and note">
        <div class="part-special-art">
          <img src="css/part1-bull.png" alt="Bull artwork from the Part I page of the Constitution of India" />
        </div>
        <div class="part-special-copy">
          <div class="part-special-label">Artwork Note</div>
          <h2>The Union and its Territory</h2>
          <p>Part I of the Constitution, titled <strong>"The Union and its Territory,"</strong> establishes the geographical and legal identity of India. The page is illustrated with a <strong>"Bull"</strong> from the Indus Valley Civilization, which represents the strength and ancient historical foundation of the Indian territory. This specific page was designed and decorated by the artist <strong>Kripal Singh (Kripal Singh Shekhawat)</strong>, whose name is inscribed at the bottom of the artwork.</p>
        </div>
      </section>
      `;
    } else if (partId === 'II') {
      artworkHtml = `
      <section class="part-special-shell" aria-label="Part II artwork and note">
        <div class="part-special-art">
          <img src="css/part2-gurukul.png" alt="Gurukul artwork from the Part II page of the Constitution of India" />
        </div>
        <div class="part-special-copy">
          <div class="part-special-label">Artwork Note</div>
          <h2>Citizenship</h2>
          <p>The illustration for Part II (Citizenship) depicts a <strong>Vedic-era Gurukul</strong>, featuring a sage and his disciples. By choosing this scene, the <strong>Santiniketan artists</strong> framed Indian citizenship as more than a legal status; it is a cultural inheritance rooted in ancient wisdom and discipline. It suggests that the modern citizen is a successor to a millennia-old tradition of ethical living and shared knowledge, grounding the Constitution in India’s oldest historical foundations.</p>
        </div>
      </section>
      `;
    } else if (partId === 'IV') {
      artworkHtml = `
      <section class="part-special-shell" aria-label="Part IV artwork and note">
        <div class="part-special-art">
          <img src="css/part4-krishna.png" alt="Bhagavad Gita artwork from the Part IV page of the Constitution of India" />
        </div>
        <div class="part-special-copy">
          <div class="part-special-label">Artwork Note</div>
          <h2>Directive Principles of State Policy</h2>
          <p><strong>The Illustration:</strong> The opening page of Part IV features a depiction of <strong>Lord Krishna preaching the Bhagavad Gita to Arjuna on the battlefield of Kurukshetra</strong>. The scene shows a chariot drawn by horses with Krishna acting as the charioteer and Arjuna as the warrior receiving guidance.</p>
          <p style="margin-top: 12px;"><strong>Connection to Part IV:</strong> Part IV details the Directive Principles of State Policy, which are fundamental guidelines for the governance of the country. Just as Krishna provided Arjuna with the <strong>moral and ethical framework ("Dharma")</strong> to perform his <strong>duty</strong>, these principles serve as the <strong>moral conscience for the State</strong> to ensure a just social order and the welfare of its people.</p>
        </div>
      </section>
      `;
    }

    if (artworkHtml) {
      card.classList.add('visible');
      card.innerHTML = artworkHtml;
    } else {
      card.classList.remove('visible');
      card.innerHTML = '';
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const partId = urlParams.get('id');

    if (!partId) {
      document.getElementById('articleListContainer').innerHTML = "<p style='text-align:center;'>No Part Selected. <a href='read-the-constitution.html'>Go back</a></p>";
      return;
    }

    fetch('data/articles.json')
      .then(res => res.json())
      .then(data => {
        const part = data.find(p => p.partId === partId);
        
        if (!part) {
          document.getElementById('partTitleDisplay').textContent = "Part Not Found";
          document.getElementById('articleListContainer').innerHTML = "<p style='text-align:center;'>This part does not exist.</p>";
          return;
        }

        // Update Header and SEO Meta Tags
        document.getElementById('partTitleDisplay').textContent = part.partTitle;
        document.getElementById('partDescDisplay').textContent = part.partDesc;
        renderPartArtwork(part.partId);
        
        document.title = `${part.partTitle} - Indian Constitution | hiConstitution`;
        document.querySelector('meta[name="description"]').setAttribute("content", part.partDesc);

        // Render Colorful List
        const container = document.getElementById('articleListContainer');
        container.innerHTML = '';

        if (!part.articles || part.articles.length === 0) {
          container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted); font-style:italic; background:#fff; border-radius:8px; border:1px solid var(--border);">Content being updated. Use Admin panel to add articles here.</div>`;
          return;
        }

        part.articles.forEach(art => {
          const item = document.createElement('a');
          item.href = `library-article.html?id=${art.id}&slug=${createSlug(art.title)}`;
          item.className = 'article-list-item';
          const hasOriginal = Boolean(art.text && art.text.trim());
          const hasSimplified = Boolean(art.simplified && art.simplified.trim());
          const hasHindi = Boolean(art.hindi && art.hindi.trim());
          
          item.innerHTML = `
            <div class="art-content">
              <h3>${art.title}</h3>
              <p>${art.preview}</p>
              <div class="art-meta">
                ${status('Original', hasOriginal)}
                ${status('Simple', hasSimplified)}
                ${status('Hindi', hasHindi)}
              </div>
            </div>
            <div class="art-arrow">→</div>
          `;
          
          container.appendChild(item);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('articleListContainer').innerHTML = "<p style='text-align:center;color:red;'>Error loading data. Ensure you are running a local server.</p>";
      });
  });
</script>
